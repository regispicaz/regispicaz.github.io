<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Régis Picáz, desenvolvedor full stack com Laravel, React e Inertia, atuando também em QA e condução ágil.">
<meta name="author" content="Régis Picáz">
<meta name="theme-color" content="#0e0d11">
<title>Régis Picáz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top bar, one reading column (980px). Separate views for Início, Sobre, Serviços,
   Projetos, each project and Contato, switched by hash. */
:root {
  --bg: #0e0d11;
  --surface: #16141b;
  --surface-2: #1d1a23;
  --line: #2b2733;
  --text: #ece5d8;
  --muted: #9b948a;
  --accent: #f2a65a;
  --accent-ink: #1a0f06;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 80px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  padding-block: 0 56px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.6 var(--sans);
  overflow-x: hidden;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; line-height: 1.1; }
p { margin: 0; text-wrap: pretty; }
.serif { font-family: var(--serif); }
.label { font: 500 12px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 980px; margin-inline: auto; min-width: 0; }
.muted { color: var(--muted); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in {
  max-width: 980px; margin-inline: auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  min-height: 60px; padding-block: 8px;
}
.brand { text-decoration: none; font: 400 22px/1 var(--serif); }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a {
  text-decoration: none; font-size: 14px; color: var(--muted);
  padding: 8px 12px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center;
}
.nav a:hover { color: var(--text); background: var(--surface); }
.nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }

/* Views */
.view { padding-top: 48px; }
.view[hidden] { display: none; }
.eyebrow { color: var(--accent); margin-bottom: 14px; }
.lede { font-size: 19px; color: var(--muted); max-width: 60ch; margin-top: 18px; }
.page-head { padding-bottom: 40px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
.page-head h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); letter-spacing: -0.01em; }
.page-head h1 em { font-style: italic; color: var(--accent); }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  font: 600 14px/1 var(--sans); text-decoration: none;
  padding: 13px 20px; min-height: 44px; border-radius: 999px;
  color: var(--accent-ink); background: var(--accent); border: 0; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--muted); }

.block { padding-block: 56px; border-bottom: 1px solid var(--line); }
.block:last-child { border-bottom: 0; }
.block-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.block-head h2 { font-size: clamp(1.9rem, 4.5vw, 2.6rem); }
.block-head a { font-size: 14px; color: var(--accent); text-decoration: none; }
.block-head a:hover { text-decoration: underline; text-underline-offset: 3px; }

.prose { font-size: 17px; max-width: 64ch; }
.prose p + p { margin-top: 16px; }

/* Cards */
.grid { display: grid; grid-template-columns: 1fr; gap: 12px; list-style: none; margin: 0; padding: 0; }
@media (min-width: 680px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.card {
  display: flex; flex-direction: column; gap: 10px; height: 100%;
  padding: 24px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; min-width: 0;
  transition: border-color .15s, background .15s;
}
a.card:hover { border-color: var(--muted); background: var(--surface-2); }
.card h3 { font-family: var(--serif); font-size: 28px; }
.card p { color: var(--muted); font-size: 15px; }
.card .label { color: var(--accent); }
.card .more { margin-top: auto; font-size: 14px; color: var(--text); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.tags li {
  font: 400 12px/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px;
}

/* Services */
.services { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--line); }
.service {
  display: grid; grid-template-columns: 1fr; gap: 8px;
  padding: 26px 0; border-bottom: 1px solid var(--line);
}
.service h3 { font-family: var(--serif); font-size: 30px; }
.service p { color: var(--muted); max-width: 62ch; }
@media (min-width: 760px) {
  .service { grid-template-columns: 1fr 2fr; gap: 40px; align-items: baseline; }
}

/* Project detail */
.project-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); margin-top: 28px; }
.project-meta > div { padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.project-meta dt { margin-bottom: 4px; }
.project-meta dd { margin: 0; }
.crumb { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
.crumb a { text-decoration: none; color: var(--muted); }
.crumb a:hover { color: var(--text); }

/* Contact */
.contact-list { display: grid; border-top: 1px solid var(--line); }
.contact-list a {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 20px 0; border-bottom: 1px solid var(--line);
  text-decoration: none; font-family: var(--serif); font-size: 28px;
}
.contact-list a:hover { color: var(--accent); }
.contact-list .label { font-family: var(--mono); font-size: 12px; }

footer {
  margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 13px;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
footer a { text-decoration: none; }
footer a:hover { color: var(--text); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" aria-label="Régis Picáz, início">Régis Picáz</a>
    <nav class="nav" aria-label="Principal">
      <a href="#" data-nav="home">Início</a>
      <a href="#sobre" data-nav="sobre">Sobre</a>
      <a href="#servicos" data-nav="servicos">Serviços</a>
      <a href="#projetos" data-nav="projetos">Projetos</a>
      <a href="#contato" data-nav="contato">Contato</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="wrap">
  <span>© Régis Picáz · <span id="year"></span></span>
  <span><a href="https://github.com/regispicaz" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/regispicaz" target="_blank" rel="noopener">LinkedIn</a></span>
</footer>

<script>
const profile = {
  name: "Régis Picáz",
  role: "Desenvolvedor Full Stack",
  roles: "Full Stack · QA · Scrum Master",
  github: "https://github.com/regispicaz",
  linkedin: "https://www.linkedin.com/in/regispicaz",
  github_handle: "@regispicaz"
};

const projects = [
  { id: "eco-fit", name: "Eco-Fit", kind: "Projeto pessoal", stack: ["Aplicação web", "Gestão de academia"],
    lead: "Aplicação de gestão para academias de fitness, cobrindo a rotina da operação.",
    body: [
      "O Eco-Fit foi pensado para a rotina de uma academia: cadastro e acompanhamento de alunos, controle da operação e a visão que a equipe precisa no dia a dia.",
      "O projeto é uma oportunidade de tratar regras de negócio reais, com fluxos que mudam conforme a operação cresce."
    ], status: "Em desenvolvimento" },
  { id: "focus", name: "Focus", kind: "Projeto pessoal", stack: ["Produtividade", "Gamificação"],
    lead: "Plataforma gamificada de produtividade baseada na técnica Pomodoro.",
    body: [
      "O Focus transforma ciclos de foco em progresso visível. A proposta é manter a técnica Pomodoro, mas dar ao usuário um retorno constante sobre o próprio ritmo.",
      "É um projeto de produto: a parte de regras e progresso importa tanto quanto a interface."
    ], status: "Em desenvolvimento" }
];

const services = [
  { title: "Desenvolvimento web full stack", text: "Aplicações completas, do banco de dados à interface, com Laravel no back-end e React com Inertia no front-end. Ideal para sistemas internos e produtos novos." },
  { title: "Manutenção e evolução", text: "Trabalho em projetos existentes: correção de bugs, refatoração, novos módulos e melhorias de desempenho, com cuidado para não quebrar o que já funciona." },
  { title: "QA e testes", text: "Planejamento e execução de testes, com foco em cenários de uso real e na documentação dos resultados para o time." },
  { title: "Condução ágil", text: "Atuação como Scrum Master, com organização de backlog, cerimônias e acompanhamento de entregas para times pequenos e médios." }
];

const app = document.getElementById("app");
const navLinks = document.querySelectorAll("[data-nav]");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function home() {
  return `
    <section class="view" aria-labelledby="hero-title">
      <header class="page-head">
        <p class="label eyebrow">${esc(profile.roles)}</p>
        <h1 id="hero-title" class="serif">Software com <em>cuidado</em> do banco de dados à tela.</h1>
        <p class="lede">Desenvolvo aplicações web completas e atuo com QA e condução ágil. Trabalho para quem precisa de um sistema que funcione, seja fácil de manter e entregue no prazo.</p>
        <div class="hero-actions">
          <a class="btn" href="#contato">Entrar em contato</a>
          <a class="btn ghost" href="#projetos">Ver projetos</a>
        </div>
      </header>

      <div class="block">
        <div class="block-head">
          <h2 class="serif">Serviços</h2>
          <a href="#servicos">Ver todos →</a>
        </div>
        <ul class="grid two">
          ${services.slice(0, 2).map(s => `<li><div class="card"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div></li>`).join("")}
        </ul>
      </div>

      <div class="block">
        <div class="block-head">
          <h2 class="serif">Projetos</h2>
          <a href="#projetos">Todos os projetos →</a>
        </div>
        <ul class="grid two">
          ${projects.map(p => `
            <li>
              <a class="card" href="#${p.id}">
                <span class="label">${esc(p.kind)}</span>
                <h3>${esc(p.name)}</h3>
                <p>${esc(p.lead)}</p>
                <span class="more">Ler o projeto →</span>
              </a>
            </li>`).join("")}
        </ul>
      </div>
    </section>`;
}

function sobre() {
  return `
    <section class="view">
      <header class="page-head">
        <p class="label eyebrow">Sobre</p>
        <h1 class="serif">Software com <em>cuidado</em>, em todas as pontas do ciclo.</h1>
      </header>
      <div class="prose">
        <p>Atuo como desenvolvedor full stack, com experiência no back-end e no front-end. Também trabalho com QA e com a condução de times em metodologia ágil, o que me ajuda a ver o produto pelos dois lados: o que é construído e como ele é validado.</p>
        <p>Gosto de projetos com regras de negócio reais, interfaces cuidadas e uma base técnica que aguente crescer. Prefiro entregas em ciclos curtos, com feedback frequente.</p>
      </div>

      <div class="block">
        <div class="block-head"><h2 class="serif">Stack</h2></div>
        <div class="grid two">
          <div class="card"><span class="label">Back-end</span><ul class="tags"><li>Laravel</li><li>InertiaJS</li></ul></div>
          <div class="card"><span class="label">Front-end</span><ul class="tags"><li>ReactJS</li><li>InertiaJS</li></ul></div>
          <div class="card"><span class="label">Infraestrutura</span><ul class="tags"><li>Docker</li></ul></div>
          <div class="card"><span class="label">Qualidade e processo</span><ul class="tags"><li>QA</li><li>Scrum</li><li>Metodologia ágil</li></ul></div>
        </div>
      </div>

    </section>`;
}

function servicos() {
  return `
    <section class="view">
      <header class="page-head">
        <p class="label eyebrow">Serviços</p>
        <h1 class="serif">O que posso <em>fazer por você</em>.</h1>
        <p class="lede">Atendo projetos novos e existentes. Cada trabalho começa com uma conversa para entender o problema antes de qualquer proposta.</p>
      </header>
      <div class="services">
        ${services.map(s => `
          <article class="service">
            <h3>${esc(s.title)}</h3>
            <p>${esc(s.text)}</p>
          </article>`).join("")}
      </div>
      <div class="hero-actions" style="margin-top:40px">
        <a class="btn" href="#contato">Solicitar uma conversa</a>
      </div>
    </section>`;
}

function projetosList() {
  return `
    <section class="view">
      <header class="page-head">
        <p class="label eyebrow">Projetos</p>
        <h1 class="serif">Projetos <em>pessoais</em> e em andamento.</h1>
      </header>
      <ul class="grid two">
        ${projects.map(p => `
          <li>
            <a class="card" href="#${p.id}">
              <span class="label">${esc(p.kind)} · ${esc(p.status)}</span>
              <h3>${esc(p.name)}</h3>
              <p>${esc(p.lead)}</p>
              <ul class="tags">${p.stack.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
              <span class="more">Ler o projeto →</span>
            </a>
          </li>`).join("")}
      </ul>
    </section>`;
}

function projetoDetail(p) {
  return `
    <section class="view">
      <nav class="crumb label" aria-label="Você está em">
        <a href="#">Início</a><span>/</span><a href="#projetos">Projetos</a><span>/</span><span>${esc(p.name)}</span>
      </nav>
      <header class="page-head">
        <p class="label eyebrow">${esc(p.kind)}</p>
        <h1 class="serif">${esc(p.name)}</h1>
        <p class="lede">${esc(p.lead)}</p>
      </header>
      <div class="prose">${p.body.map(b => `<p>${esc(b)}</p>`).join("")}</div>
      <dl class="project-meta">
        <div><dt class="label">Tipo</dt><dd>${esc(p.kind)}</dd></div>
        <div><dt class="label">Status</dt><dd>${esc(p.status)}</dd></div>
      </dl>
      <div class="block" style="padding-bottom:0">
        <div class="block-head"><h2 class="serif">Tecnologias e temas</h2></div>
        <ul class="tags">${p.stack.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </div>
    </section>`;
}

function contato() {
  return `
    <section class="view">
      <header class="page-head">
        <p class="label eyebrow">Contato</p>
        <h1 class="serif">Vamos <em>conversar</em>.</h1>
        <p class="lede">Para projetos, vagas ou uma troca de ideias, me chame pelos canais abaixo.</p>
      </header>
      <nav class="contact-list" aria-label="Canais">
        <a href="${profile.github}" target="_blank" rel="noopener"><span>GitHub</span><span class="label">${esc(profile.github_handle)}</span></a>
        <a href="${profile.linkedin}" target="_blank" rel="noopener"><span>LinkedIn</span><span class="label">/in/regispicaz</span></a>
      </nav>
    </section>`;
}

const routes = {
  "": { nav: "home", html: home },
  "sobre": { nav: "sobre", html: sobre },
  "servicos": { nav: "servicos", html: servicos },
  "projetos": { nav: "projetos", html: projetosList },
  "contato": { nav: "contato", html: contato }
};

function render() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ""; }
  const project = projects.find(p => p.id === h);
  let html, active = "";
  if (project) { html = projetoDetail(project); active = "projetos"; }
  else if (routes[h]) { html = routes[h].html(); active = routes[h].nav; }
  else { html = home(); active = "home"; }
  app.innerHTML = html;
  navLinks.forEach(a => {
    if (a.dataset.nav === active) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo({ top: 0, behavior: "auto" });
  document.title = (project ? project.name + " · " : "") + profile.name;
}

// Desenha a view inicial antes de qualquer outra coisa, para a home aparecer já no carregamento.
render();
window.addEventListener("hashchange", render);

// O rodapé fica depois do script no HTML, então o ano só é preenchido se o elemento existir.
const yearEl = document.getElementById("year");
if (yearEl) yearEl.textContent = new Date().getFullYear();
</script>

</body>
</html>
